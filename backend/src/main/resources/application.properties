server.port=8080

spring.application.name=ai-team-matcher

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/ai_team_matcher?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:bablu2006}
